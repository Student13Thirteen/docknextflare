name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n docknextflare
          bash -n scripts/ci_smoke.sh

      - name: Run ShellCheck
        run: shellcheck --severity=warning docknextflare scripts/ci_smoke.sh

      - name: Validate Compose model
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Confirm no host ports are published
        run: |
          if docker compose config | grep -Eq '^[[:space:]]+ports:'; then
            echo 'Host ports must remain unpublished.' >&2
            exit 1
          fi

      - name: Confirm secrets and runtime data are ignored
        run: |
          git check-ignore -q .env
          git check-ignore -q data/example
          git check-ignore -q backups/example
          rm .env

      - name: Smoke-test Nextcloud and MariaDB from a clean workspace
        run: bash scripts/ci_smoke.sh
